<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Calculadora binária</title>
		<link href="css/style.css" rel="stylesheet">
	</head>
	<body>

		<div id="container">
			<div id="input-container">
				<label for="val1">Valor 1:</label>
				<input type="number" id="val1" class="val-input" name="val1" value="0" placeholder="Valor 1">
				<br>
				<label for="val2">Valor 2:</label>
				<input type="number" id="val2" class="val-input" name="val2" value="0" placeholder="Valor 2">
				<br>
				<label for="operacoes">Operação:</label>
				<select id="operacoes" name="operacoes">
					<option value="+">Soma</option>
					<option value="-">Subtração</option>
					<option value="*">Multiplicação</option>
					<option value="/">Divisão</option>
				</select>	
			</div>

			<div id="button">
				<button type="button" onclick="calcular()">Calcular</button>
			</div>

			<div id="resultado"></div>
		</div>

		<footer>
			&copy; 2025 Pedro Paulo
		</footer>

		<script src="js/script.js"></script>
	</body>
</html>
