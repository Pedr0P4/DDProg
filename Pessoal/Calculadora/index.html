<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Calculadora</title>
		<link href="css/style.css" rel="stylesheet">
	</head>
	<body>

		<div id="calculadora">
			<div id="visor">
				<input type="text" class="vsr-estilo" name="visor" disabled>	
			</div>
			<div id="teclado">
				<div id="funcoes">
					<button type="button" class="func-tecla tcl-estilo">M+</button>
					<button type="button" class="func-tecla tcl-estilo">M-</button>
					<button type="button" class="func-tecla tcl-estilo">MR</button>
					<button type="button" class="func-tecla tcl-estilo">MC</button>
					<button type="button" class="func-tecla tcl-estilo">CE</button>
					<button type="button" class="func-tecla tcl-estilo">C</button>
				</div>
				<div id="principal">
					<div id="numeros">
						<button type="button" class="tecla tcl-estilo">9</button>
						<button type="button" class="tecla tcl-estilo">8</button>
						<button type="button" class="tecla tcl-estilo">7</button>
						<button type="button" class="tecla tcl-estilo">6</button>
						<button type="button" class="tecla tcl-estilo">5</button>
						<button type="button" class="tecla tcl-estilo">4</button>
						<button type="button" class="tecla tcl-estilo">3</button>
						<button type="button" class="tecla tcl-estilo">2</button>
						<button type="button" class="tecla tcl-estilo">1</button>
						<button type="button" class="tecla tcl-estilo">+/-</button>
						<button type="button" class="tecla tcl-estilo">0</button>
						<button type="button" class="tecla tcl-estilo">=</button>
					</div>
					<div id="operacoes">
						<button type="button" class="tecla tcl-estilo">/</button>
						<button type="button" class="tecla tcl-estilo">x</button>
						<button type="button" class="tecla tcl-estilo">-</button>
						<button type="button" class="tecla tcl-estilo">+</button>
					</div>
				</div>
			</div>
		</div>

		<script src="js/script.js"></script>
	</body>
</html>
